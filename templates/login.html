<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish — GandbolPro</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">🤾</div>
    <div class="login-title">GandbolPro</div>
    <div class="login-sub">Murabbiy yoki sportchi sifatida kiring</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash flash-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="input-group">
        <label>Login</label>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="input-group">
        <label>Parol</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:6px;">Kirish</button>
    </form>
    <div style="margin-top:16px; font-size:11px; color:var(--text3); text-align:center;">
      Murabbiy: login <b>coach</b> · parol <b>coach123</b> (birinchi kirishdan keyin o'zgartiring)
    </div>
  </div>
</div>
</body>
</html>
